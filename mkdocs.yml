site_name: 物理自学手册
site_url: https://physdiy.wiki/
site_author: phys-self-learning
site_description: >-
  一份面向自学者与转行者的物理学开源学习路线与资源索引

repo_name: physics-self-learning
repo_url: https://github.com/your-name/physics-self-learning/

copyright: Copyright &copy; 2026-present 物理自学手册

theme:
  name: material
  language: zh
  features:
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - content.code.annotate
    - search.highlight
    - search.suggest
    - search.share

  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: teal
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式

  font:
    text: Roboto Slab
    code: Roboto Mono

markdown_extensions:
  - attr_list
  - md_in_html
  - footnotes
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search:
      lang:
        - zh
  - git-revision-date
  - minify:
      minify_html: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-name/physics-self-learning/

nav:
