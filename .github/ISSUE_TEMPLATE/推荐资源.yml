name: 推荐一门课 / 一本教材
description: 推荐你认为值得收录的优质物理资源
title: "[资源推荐] "
labels: ["resource"]
body:
  - type: markdown
    value: |
      感谢你愿意分享。为了确保收录质量，请尽量填全下面几项。
      **我们只收录真正用过、并且觉得好的资源**——没亲自用过的请不要凭口碑推荐。

  - type: input
    id: name
    attributes:
      label: 资源名称
      description: 课程或教材的完整名称
      placeholder: 例如：MIT 8.333 Statistical Mechanics I
    validations:
      required: true

  - type: input
    id: link
    attributes:
      label: 链接
      placeholder: https://...
    validations:
      required: true

  - type: dropdown
    id: category
    attributes:
      label: 属于哪个板块
      options:
        - 数学基础
        - 普通物理
        - 四大力学
        - 计算物理
        - 进阶理论
        - 轨道
        - 工具箱
        - 其他
    validations:
      required: true

  - type: textarea
    id: experience
    attributes:
      label: 你的使用体验
      description: |
        这一项最重要。请写清楚：你什么时候用的、用在什么场景、它好在哪、不适合什么人。
        泛泛的"讲得很好"无法说服别人。
      placeholder: |
        我在大三上量子力学时用它作为第二本教材……
        它最突出的地方是……
        但它不适合……因为……
    validations:
      required: true

  - type: textarea
    id: compare
    attributes:
      label: 与同类资源的比较
      description: 如果本书已收录了同类资源，说明这本相比如何、是替代还是补充
    validations:
      required: false

  - type: checkboxes
    id: license
    attributes:
      label: 确认
      options:
        - label: 该资源是公开可访问的，且我没有提供盗版扫描件的直链
          required: true
        - label: 链接我已亲自点开验证过
          required: true
